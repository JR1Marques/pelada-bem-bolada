# ⚽ Pelada Bem Bolada

> **Confirma, divide e joga**

O aplicativo que organiza as partidas amadoras de futebol de forma simples, prática e equilibrada.

## 🎯 O que fazemos
- ✅ Confirmação de presença dos jogadores
- 🔄 Divisão automática e equilibrada dos times
- 💰 Controle de pagamentos e rateio
- 📱 PWA (funciona offline e no celular)

## ️ Stack
- **Frontend**: Vite + React + TypeScript + Tailwind CSS + Framer Motion
- **Backend**: Supabase (PostgreSQL + Auth)
- **Hospedagem**: Vercel (Frontend) + Supabase (Backend)
- **Qualidade**: Biome, Commitlint, GitHub Actions

## 📋 Diretrizes
Consulte [PROJECT_GUIDELINES.md](./PROJECT_GUIDELINES.md) para padrões de desenvolvimento.

